<main class="section"><div class="container"><h1>Resume analyzer</h1>
<p class="muted" style="margin-bottom:1rem">Rule-based check: finds required skills in your text and checks that key sections exist.</p>
<div class="split" style="align-items:start">
<div class="card">
  <div id="err" class="hidden" role="alert"></div>
  <div class="field"><label for="resumeText">Resume text</label><textarea id="resumeText" style="min-height:240px" placeholder="Paste your resume text here"></textarea></div>
  <div class="field" style="margin-top:.8rem"><label for="resumeFile">Or load a .txt file</label><input id="resumeFile" type="file" accept=".txt"></div>
  <div class="field" style="margin-top:.8rem"><label for="jobSelect">Compare with a job</label><select id="jobSelect"><option value="">Custom skills (type below)</option></select></div>
  <div class="field" style="margin-top:.8rem"><label for="customSkills">Custom required skills</label><input id="customSkills" placeholder="Python, SQL, Git"></div>
  <div class="form-actions"><button class="btn" id="analyzeBtn" type="button">Analyze resume</button></div>
</div>
<div id="result" class="hidden" aria-live="polite"></div>
</div></div></main>
<footer id="site-footer"></footer>
<script src="layout.js"></script>
<script src="data.js"></script>
<script src="analyzer.js"></script>

</body>
